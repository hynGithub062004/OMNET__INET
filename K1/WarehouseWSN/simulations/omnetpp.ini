[General]
network = warehousewsn.simulations.WarehouseWSN
sim-time-limit = 10s

# Background noise used by RadioMedium
*.radioMedium.backgroundNoise.power = -110dBm


# ===================================================================
# K1 MINIMAL
# Create 10 sensor nodes and one gateway
# ===================================================================

[Config K1_Minimal]
description = "Minimal topology with 10 sensors and one gateway"

*.numSensors = 10


# ===================================================================
# K1 COORDINATES
# Assign fixed positions to 10 sensors and one corner gateway
# ===================================================================

[Config K1_Coordinates]
extends = K1_Minimal
description = "K1 with fixed coordinates for 10 sensors and one corner gateway"

# -------------------------------------------------------------------
# Stationary mobility
# -------------------------------------------------------------------

*.sensor[*].mobility.typename = "StationaryMobility"
*.gateway.mobility.typename = "StationaryMobility"

*.sensor[*].mobility.initFromDisplayString = false
*.gateway.mobility.initFromDisplayString = false

*.sensor[*].mobility.initialZ = 0m
*.gateway.mobility.initialZ = 0m

# -------------------------------------------------------------------
# Gateway position
# -------------------------------------------------------------------

*.gateway.mobility.initialX = 5m
*.gateway.mobility.initialY = 5m

# -------------------------------------------------------------------
# First sensor row
# -------------------------------------------------------------------

*.sensor[0].mobility.initialX = 20m
*.sensor[0].mobility.initialY = 15m

*.sensor[1].mobility.initialX = 35m
*.sensor[1].mobility.initialY = 15m

*.sensor[2].mobility.initialX = 50m
*.sensor[2].mobility.initialY = 15m

*.sensor[3].mobility.initialX = 65m
*.sensor[3].mobility.initialY = 15m

*.sensor[4].mobility.initialX = 80m
*.sensor[4].mobility.initialY = 15m

# -------------------------------------------------------------------
# Second sensor row
# -------------------------------------------------------------------

*.sensor[5].mobility.initialX = 20m
*.sensor[5].mobility.initialY = 45m

*.sensor[6].mobility.initialX = 35m
*.sensor[6].mobility.initialY = 45m

*.sensor[7].mobility.initialX = 50m
*.sensor[7].mobility.initialY = 45m

*.sensor[8].mobility.initialX = 65m
*.sensor[8].mobility.initialY = 45m

*.sensor[9].mobility.initialX = 80m
*.sensor[9].mobility.initialY = 45m

# -------------------------------------------------------------------
# Warehouse scene bounds
# -------------------------------------------------------------------

*.visualizer.sceneVisualizer.sceneMinX = 0m
*.visualizer.sceneVisualizer.sceneMinY = 0m
*.visualizer.sceneVisualizer.sceneMinZ = 0m

*.visualizer.sceneVisualizer.sceneMaxX = 100m
*.visualizer.sceneVisualizer.sceneMaxY = 60m
*.visualizer.sceneVisualizer.sceneMaxZ = 1m

# -------------------------------------------------------------------
# Canvas scale and translation
# These parameters affect visualization only
# -------------------------------------------------------------------

*.visualizer.sceneVisualizer.viewScale = "8 8"
*.visualizer.sceneVisualizer.viewTranslation = "60 60"


# ===================================================================
# K1 ONE-SENSOR UDP VALIDATION
# Use AckingWirelessInterface only to verify basic UDP connectivity
# ===================================================================

[Config K1_OneSensorUdp]
extends = K1_Coordinates
description = "K1 validation with one sensor sending UDP packets to the gateway"

sim-time-limit = 10s

# -------------------------------------------------------------------
# IPv4 and ARP
# -------------------------------------------------------------------

*.configurator.addStaticRoutes = true

*.sensor[*].ipv4.arp.typename = "GlobalArp"
*.gateway.ipv4.arp.typename = "GlobalArp"

# -------------------------------------------------------------------
# Application configuration
# Specific rules must be placed before general wildcard rules
# -------------------------------------------------------------------

# Enable one UDP application on sensor[0]
*.sensor[0].numApps = 1

*.sensor[0].app[0].typename = "UdpBasicApp"
*.sensor[0].app[0].destAddresses = "gateway"
*.sensor[0].app[0].destPort = 5000
*.sensor[0].app[0].messageLength = 64B
*.sensor[0].app[0].sendInterval = 1s
*.sensor[0].app[0].startTime = 1s
*.sensor[0].app[0].stopTime = 9s
*.sensor[0].app[0].packetName = "SensorData"

# All remaining sensors have no application in this validation step
*.sensor[*].numApps = 0

# Gateway receives UDP packets
*.gateway.numApps = 1
*.gateway.app[0].typename = "UdpSink"
*.gateway.app[0].localPort = 5000

# -------------------------------------------------------------------
# Basic wireless interface used only for connectivity validation
# -------------------------------------------------------------------

*.radioMedium.signalAnalogRepresentation = "unitDisk"

*.sensor[*].wlan[0].typename = "AckingWirelessInterface"
*.gateway.wlan[0].typename = "AckingWirelessInterface"

*.sensor[*].wlan[0].radio.signalAnalogRepresentation = "unitDisk"
*.gateway.wlan[0].radio.signalAnalogRepresentation = "unitDisk"

*.sensor[*].wlan[0].radio.transmitter.analogModel.communicationRange = 100m
*.gateway.wlan[0].radio.transmitter.analogModel.communicationRange = 100m

*.sensor[*].wlan[0].radio.receiver.ignoreInterference = true
*.gateway.wlan[0].radio.receiver.ignoreInterference = true

# These parameters belong to AckingMac
*.sensor[*].wlan[0].mac.useAck = false
*.gateway.wlan[0].mac.useAck = false

*.sensor[*].wlan[0].mac.fullDuplex = false
*.gateway.wlan[0].mac.fullDuplex = false

*.sensor[*].wlan[0].mac.headerLength = 23B
*.gateway.wlan[0].mac.headerLength = 23B

# Apply bitrate to all matching MAC and radio submodules
*.sensor[*].**.bitrate = 1Mbps
*.gateway.**.bitrate = 1Mbps

# -------------------------------------------------------------------
# Visualization
# -------------------------------------------------------------------

*.sensor[0].wlan[0].radio.displayCommunicationRange = true

*.visualizer.mediumVisualizer.displaySignals = true
*.visualizer.physicalLinkVisualizer.displayLinks = true
*.visualizer.physicalLinkVisualizer.packetFilter = "SensorData*"


# ===================================================================
# K1 ONE-SENSOR CSMA/CA AND ACK VALIDATION
# This configuration extends K1_Coordinates directly
# ===================================================================

[Config K1_OneSensorCsmaAck]
extends = K1_Coordinates
description = "K1 validation with one UDP sensor, CSMA/CA, interference and MAC ACK"

sim-time-limit = 10s

# -------------------------------------------------------------------
# IPv4 and ARP
# -------------------------------------------------------------------

*.configurator.addStaticRoutes = true

*.sensor[*].ipv4.arp.typename = "GlobalArp"
*.gateway.ipv4.arp.typename = "GlobalArp"

# -------------------------------------------------------------------
# Application configuration
# -------------------------------------------------------------------

# Enable one UDP application on sensor[0]
*.sensor[0].numApps = 1

*.sensor[0].app[0].typename = "UdpBasicApp"
*.sensor[0].app[0].destAddresses = "gateway"
*.sensor[0].app[0].destPort = 5000
*.sensor[0].app[0].messageLength = 64B
*.sensor[0].app[0].sendInterval = 1s
*.sensor[0].app[0].startTime = 1s
*.sensor[0].app[0].stopTime = 9s
*.sensor[0].app[0].packetName = "SensorData"

# All remaining sensors have no application in this validation step
*.sensor[*].numApps = 0

# Gateway receives UDP packets
*.gateway.numApps = 1
*.gateway.app[0].typename = "UdpSink"
*.gateway.app[0].localPort = 5000

# -------------------------------------------------------------------
# Wireless interface
# -------------------------------------------------------------------

*.sensor[*].wlan[0].typename = "WirelessInterface"
*.gateway.wlan[0].typename = "WirelessInterface"

# -------------------------------------------------------------------
# Generic radio
# -------------------------------------------------------------------

*.radioMedium.signalAnalogRepresentation = "unitDisk"

*.sensor[*].wlan[0].radio.typename = "GenericRadio"
*.gateway.wlan[0].radio.typename = "GenericRadio"

*.sensor[*].wlan[0].radio.signalAnalogRepresentation = "unitDisk"
*.gateway.wlan[0].radio.signalAnalogRepresentation = "unitDisk"

*.sensor[*].wlan[0].radio.transmitter.analogModel.communicationRange = 100m
*.gateway.wlan[0].radio.transmitter.analogModel.communicationRange = 100m

*.sensor[*].wlan[0].radio.transmitter.analogModel.interferenceRange = 120m
*.gateway.wlan[0].radio.transmitter.analogModel.interferenceRange = 120m

*.sensor[*].wlan[0].radio.receiver.ignoreInterference = false
*.gateway.wlan[0].radio.receiver.ignoreInterference = false

# -------------------------------------------------------------------
# CSMA/CA and MAC acknowledgment
# -------------------------------------------------------------------

*.sensor[*].wlan[0].mac.typename = "CsmaCaMac"
*.gateway.wlan[0].mac.typename = "CsmaCaMac"

*.sensor[*].wlan[0].mac.useAck = true
*.gateway.wlan[0].mac.useAck = true

*.sensor[*].wlan[0].mac.ackTimeout = 300us
*.gateway.wlan[0].mac.ackTimeout = 300us

*.sensor[*].wlan[0].mac.headerLength = 23B
*.gateway.wlan[0].mac.headerLength = 23B

# CsmaCaMac in INET 4.7.0 does not expose fullDuplex

# -------------------------------------------------------------------
# MAC queue
# -------------------------------------------------------------------

*.sensor[*].wlan[0].queue.typename = "DropTailQueue"
*.gateway.wlan[0].queue.typename = "DropTailQueue"

*.sensor[*].wlan[0].queue.packetCapacity = 50
*.gateway.wlan[0].queue.packetCapacity = 50

# -------------------------------------------------------------------
# Bitrate
# -------------------------------------------------------------------

*.sensor[*].wlan[0].mac.bitrate = 1Mbps
*.gateway.wlan[0].mac.bitrate = 1Mbps

*.sensor[*].wlan[0].radio.transmitter.bitrate = 1Mbps
*.gateway.wlan[0].radio.transmitter.bitrate = 1Mbps

# -------------------------------------------------------------------
# Visualization
# -------------------------------------------------------------------

*.sensor[0].wlan[0].radio.displayCommunicationRange = true

*.visualizer.mediumVisualizer.displaySignals = true
*.visualizer.physicalLinkVisualizer.displayLinks = true
*.visualizer.physicalLinkVisualizer.packetFilter = "SensorData*"


# ===================================================================
# K1 ALL-SENSOR CSMA/CA AND ACK
# Enable periodic UDP traffic on all 10 sensor nodes
# ===================================================================

[Config K1_AllSensorsCsmaAck]
extends = K1_OneSensorCsmaAck
description = "K1 with 10 UDP sensors, CSMA/CA, interference and MAC ACK"

sim-time-limit = 20s

# -------------------------------------------------------------------
# Enable one UDP application on all 10 sensors
# -------------------------------------------------------------------

*.sensor[*].numApps = 1

*.sensor[*].app[0].typename = "UdpBasicApp"
*.sensor[*].app[0].destAddresses = "gateway"
*.sensor[*].app[0].destPort = 5000
*.sensor[*].app[0].messageLength = 64B
*.sensor[*].app[0].sendInterval = 1s

# Randomize the first transmission time to avoid artificial
# synchronization among all sensors
*.sensor[*].app[0].startTime = uniform(1s, 2s)

*.sensor[*].app[0].stopTime = 19s
*.sensor[*].app[0].packetName = "SensorData"

# -------------------------------------------------------------------
# Gateway keeps the same UDP sink
# -------------------------------------------------------------------

*.gateway.numApps = 1
*.gateway.app[0].typename = "UdpSink"
*.gateway.app[0].localPort = 5000

# -------------------------------------------------------------------
# Visualization
# -------------------------------------------------------------------

*.sensor[*].wlan[0].radio.displayCommunicationRange = false

*.visualizer.mediumVisualizer.displaySignals = true
*.visualizer.physicalLinkVisualizer.displayLinks = true
*.visualizer.physicalLinkVisualizer.packetFilter = "SensorData*"


# ===================================================================
# K1 ENERGY MODEL
# Add finite energy storage and sensor-oriented radio power model
# ===================================================================

[Config K1_AllSensorsEnergy]
extends = K1_AllSensorsCsmaAck
description = "K1 with 10 UDP sensors, CSMA/CA, MAC ACK and energy model"

sim-time-limit = 20s

# -------------------------------------------------------------------
# Node status required by SimpleEpEnergyStorage
# -------------------------------------------------------------------

*.sensor[*].hasStatus = true

# -------------------------------------------------------------------
# Finite energy storage for all sensor nodes
# -------------------------------------------------------------------

*.sensor[*].energyStorage.typename = "SimpleEpEnergyStorage"

*.sensor[*].energyStorage.nominalCapacity = 100J
*.sensor[*].energyStorage.initialCapacity = 100J

# This affects only how often capacity changes are printed in the log
*.sensor[*].energyStorage.printCapacityStep = 0.001J

# -------------------------------------------------------------------
# Sensor-oriented radio energy consumer
# -------------------------------------------------------------------

*.sensor[*].wlan[0].radio.energyConsumer.typename = "SensorStateBasedEpEnergyConsumer"

# -------------------------------------------------------------------
# Result recording
#
# residualEnergyCapacity:
#   vector = energy variation over simulation time
#   last   = remaining energy at simulation end
#
# powerConsumption:
#   vector = radio power consumption over simulation time
# -------------------------------------------------------------------

*.sensor[*].energyStorage.residualEnergyCapacity.result-recording-modes = vector,last

*.sensor[*].wlan[0].radio.energyConsumer.powerConsumption.result-recording-modes = vector

# -------------------------------------------------------------------
# Energy visualization
# -------------------------------------------------------------------

*.visualizer.energyStorageVisualizer.displayEnergyStorages = true

# ===================================================================
# K1 FINAL MULTI-SEED EXPERIMENT
# Run the complete K1 model with five independent repetitions
# ===================================================================

[Config K1_Final]
extends = K1_AllSensorsEnergy
description = "Final K1 experiment with five independent repetitions"

# -------------------------------------------------------------------
# Simulation duration and repetitions
# -------------------------------------------------------------------

sim-time-limit = 100s
warmup-period = 10s

repeat = 5
seed-set = ${repetition}

# -------------------------------------------------------------------
# Output files
# -------------------------------------------------------------------

output-scalar-file = results/K1_Final-${repetition}.sca
output-vector-file = results/K1_Final-${repetition}.vec

# -------------------------------------------------------------------
# Application traffic
# -------------------------------------------------------------------

*.sensor[*].app[0].startTime = uniform(11s, 12s)
*.sensor[*].app[0].stopTime = 99s

# -------------------------------------------------------------------
# Application-level packet statistics
# -------------------------------------------------------------------

*.sensor[*].app[0].packetSent.result-recording-modes = count
*.gateway.app[0].packetReceived.result-recording-modes = count

# -------------------------------------------------------------------
# End-to-End Delay
# vector stores individual delay samples
# stats stores count, mean, min, max and standard deviation
# -------------------------------------------------------------------

*.gateway.app[0].endToEndDelay.result-recording-modes = vector,stats

# -------------------------------------------------------------------
# Energy Remaining
# -------------------------------------------------------------------

*.sensor[*].energyStorage.residualEnergyCapacity.result-recording-modes = vector,last

# Radio power-consumption vectors are kept for verification
*.sensor[*].wlan[0].radio.energyConsumer.powerConsumption.result-recording-modes = vector

# -------------------------------------------------------------------
# Disable unnecessary visualization during batch execution
# -------------------------------------------------------------------

*.visualizer.mediumVisualizer.displaySignals = false
*.visualizer.physicalLinkVisualizer.displayLinks = false
*.visualizer.energyStorageVisualizer.displayEnergyStorages = false

*.sensor[*].wlan[0].radio.displayCommunicationRange = false